# Finish an Ironfang Rig run: the suite's expectations are judged against
# the timeline and the outcome decides the step. Use with `if: always()`
# so the run ends whatever the tests did.
name: Finish Ironfang Rig run
description: Finish a run, print the verdicts and fail the step when the outcome is fail.
author: Ironfang Ltd

branding:
  icon: check-square
  color: gray-dark

inputs:
  run-id:
    description: The run id from the start action.
    required: true
  outcome:
    description: pass, fail or none to override the verdicts; default derived from the suite's expectations.
    default: ''
  fail-on:
    description: When to fail the step - `fail` (the run's outcome is fail) or `never`.
    default: fail
  version:
    description: The ironfang-rig release to download and verify against its checksums.
    default: 0.1.0
  binary:
    description: A prebuilt ironfang-rig binary to use instead of downloading.
    default: ''
runs:
  using: composite
  steps:
    - id: cli
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_BINARY: ${{ inputs.binary }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        "$ACTION_PATH/../cli.sh" >> "$GITHUB_OUTPUT"
    - shell: bash
      env:
        IRONFANG_RIG_BIN: ${{ steps.cli.outputs.bin }}
        INPUT_RUN_ID: ${{ inputs.run-id }}
        INPUT_OUTCOME: ${{ inputs.outcome }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        set -euo pipefail
        args=(finish "$INPUT_RUN_ID")
        if [ -n "$INPUT_OUTCOME" ]; then args+=(--outcome "$INPUT_OUTCOME"); fi
        set +e
        "$IRONFANG_RIG_BIN" "${args[@]}"
        code=$?
        set -e
        if [ "$code" -eq 3 ] && [ "$INPUT_FAIL_ON" = never ]; then
          echo "the run's outcome is fail; fail-on is never, so the step passes"
          exit 0
        fi
        exit "$code"
